name : First Workflow script

on:
  push:
    branches:
      - main



jobs:
  first-build-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: "Repo files checkout"
        uses: actions/checkout@v4

      - name: "Docker Image build"
        run: docker image build -t flask-app:v1 -f app/Dockerfile app/

      - name: "Docker container run"
        run: docker container run -d --name flaskapp -p 5000:5000 flask-app:v1

      - name: "Docker container check"
        run : docker container ls -a

      - name: "Check container logs"
        run: docker logs flaskapp

      - name: "Wait for application"
        run: sleep 5

      - name: "Check the flask app status"
        run: ./app/check.sh

      - name: "Clean the Docker container"
        if: always()
        run : docker container rm -f flaskapp

      - name: "Aws configuration"
        uses: aws-actions/configure-aws-credentials@v4
        with:
             aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
             aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
             aws-region: ap-south-1

      - name: "Verify AWS identity"
        run: aws sts get-caller-identity
