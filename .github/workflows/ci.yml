name : First Workflow script 

on:
  push:
    branches:
      - main



jobs:
  first-build-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: "Repo files checkout"
        uses: actions/checkout@v4

      - name: "Docker Image build"
        run: docker image build -t flask-app:v1 -f app/Dockerfile app/







